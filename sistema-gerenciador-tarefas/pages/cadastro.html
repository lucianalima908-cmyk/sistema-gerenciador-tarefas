<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Tarefas</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <main class="container">
        <h1>Criar Conta</h1>

        <form action="#" method="post">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p class="texto-centro margem-top">
            Já tem conta?
            <a href="../index.html" class="btn-cancelar">Cancelar</a>
            Fazer login
            </a>
        </p>
    </main>

    <footer>
        <p>© 2026 Sistema Gerenciador de Tarefas</p>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
